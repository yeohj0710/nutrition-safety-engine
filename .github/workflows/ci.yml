name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:provenance
      - run: npm run test:scenarios:smoke
      - run: npm run build
      - run: python tools/validate_phase01.py
      - run: python tools/validate_phase02.py
      - run: python tools/validate_phase06_gate.py
