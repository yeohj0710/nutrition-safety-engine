name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m pip install -r requirements-research.lock.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:provenance
      - run: npm run test:scenarios:smoke
      - run: npm run validate:phase07:proxy
      - run: python tools/validate_phase07_review_queues.py
      - run: python tools/validate_phase07_queue_preservation.py
      - run: npm run evaluate:phase07:gold
      - run: python tools/build_phase07_release_readiness.py
      - run: npm run build
      - run: python tools/validate_phase01.py
      - run: python tools/validate_phase02.py
      - run: python tools/validate_phase02_evidence_manifest.py
      # Phase 03 full raw-PubMed rehash is local-only because 266 MB XML is not distributed in Git.
      - run: python tools/validate_phase03_queue_preservation.py
      - run: python tools/build_duplicate_review_context.py
      - run: python tools/validate_duplicate_review_context.py
      - run: python tools/build_registry_link_review_context.py
      - run: python tools/validate_registry_link_review_context.py
      - run: python tools/build_screening_review_context.py
      - run: python tools/validate_screening_review_context.py
      - run: python tools/build_nonpubmed_screening_context.py
      - run: python tools/validate_nonpubmed_screening_context.py
      - run: python tools/validate_extraction_data_dictionary.py
      - run: python tools/validate_synthesis_authoring_docs.py
      - run: python tools/validate_clinicaltrials_proxy.py
      - run: python tools/validate_pmc_fulltext_candidates.py
      - run: python tools/validate_pmc_sentinel_fulltext.py
      - run: python tools/validate_central_hitcount_observations.py
      - run: python tools/validate_koreamed_designpilot.py
      - run: python tools/validate_korean_db_split_pilot.py
      - run: python tools/validate_korean_db_press_queue.py
      - run: python tools/validate_korean_db_press_preservation.py
      - run: python tools/validate_phase04_proxy.py
      - run: python tools/validate_phase05_proxy.py
      - run: python tools/validate_claim_rule_contract.py
      - run: python tools/validate_phase06_gate.py
      - run: python tools/validate_methods_checkpoint.py
      - run: python tools/validate_finalization_readiness.py
      - run: python tools/validate_results_freeze.py
      - run: python tools/validate_local_production_smoke.py
      - run: python tools/validate_human_handoff_manifest.py
      - run: python tools/validate_secondary_screening_queue.py
      - run: python tools/validate_secondary_queue_preservation.py
      - run: python tools/validate_fulltext_review_queue.py
      - run: python tools/validate_fulltext_queue_preservation.py
      - run: python tools/validate_extraction_rob_work_queues.py
      - run: python tools/validate_extraction_rob_queue_preservation.py
      - run: python tools/validate_phase05_preservation.py
      - run: python tools/validate_human_extraction_rob_rows.py
      - run: python tools/evaluate_ai_extraction.py
